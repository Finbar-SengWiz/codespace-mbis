<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Tetris</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --grid-line: #21262d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: var(--sidebar-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #game-board {
            border: 2px solid var(--border-color);
            background-color: #000;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            width: 150px;
            justify-content: space-between;
        }

        .stat-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        #next-piece {
            background-color: #000;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .controls-info {
            font-size: 0.75rem;
            color: #8b949e;
            line-height: 1.4;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        #test-results {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: #444;
            max-width: 200px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div style="position: relative;">
            <canvas id="game-board" width="240" height="480"></canvas>
            <div id="overlay">
                <h1 id="overlay-text">TETRIS</h1>
                <button class="btn" id="start-btn">START GAME</button>
            </div>
        </div>
        
        <div class="sidebar">
            <div>
                <div class="stat-box">
                    <div class="stat-label">Next</div>
                    <canvas id="next-piece" width="100" height="100"></canvas>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div id="score" class="stat-value">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Level</div>
                    <div id="level" class="stat-value">1</div>
                </div>
            </div>

            <div>
                <div class="controls-info">
                    Arrows: Move & Rotate<br>
                    Space: Hard Drop<br>
                    P: Pause
                </div>
                <button class="btn" id="sound-toggle">🔊 Sound: ON</button>
            </div>
        </div>
    </div>

    <div id="test-results"></div>

    <script>
        // --- CONSTANTS ---
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 24;
        const COLORS = [
            null,
            '#FF0D72', // T
            '#0DC2FF', // I
            '#0DFF72', // S
            '#F538FF', // Z
            '#FF8E0D', // L
            '#FFE138', // O
            '#3877FF', // J
        ];

        const SHAPES = [
            null,
            [[0, 1, 0], [1, 1, 1], [0, 0, 0]], // T
            [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]], // I
            [[0, 3, 3], [3, 3, 0], [0, 0, 0]], // S
            [[4, 4, 0], [0, 4, 4], [0, 0, 0]], // Z
            [[5, 0, 0], [5, 5, 5], [0, 0, 0]], // L
            [[6, 6], [6, 6]], // O
            [[0, 0, 7], [7, 7, 7], [0, 0, 0]], // J
        ];

        // --- AUDIO ENGINE ---
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            play(type) {
                if (!this.enabled || !this.ctx) return;
                this.init();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                const now = this.ctx.currentTime;

                switch(type) {
                    case 'move':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(150, now);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'rotate':
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'clear':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'drop':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.linearRampToValueAtTime(50, now + 0.1);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'gameover':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                        osc.start(now);
                        osc.stop(now + 0.5);
                        break;
                }
            }
        }

        const audio = new AudioEngine();

        // --- GAME LOGIC ---
        class Tetris {
            constructor() {
                this.canvas = document.getElementById('game-board');
                this.ctx = this.canvas.getContext('2d');
                this.nextCanvas = document.getElementById('next-piece');
                this.nextCtx = this.nextCanvas.getContext('2d');
                
                this.board = this.createBoard();
                this.piece = null;
                this.nextPiece = this.getRandomPiece();
                
                this.score = 0;
                this.level = 1;
                this.lines = 0;
                this.gameOver = false;
                this.paused = false;
                
                this.dropCounter = 0;
                this.dropInterval = 1000;
                this.lastTime = 0;

                this.bindControls();
                this.reset();
            }

            createBoard() {
                return Array.from({length: ROWS}, () => Array(COLS).fill(0));
            }

            getRandomPiece() {
                const typeId = Math.floor(Math.random() * (SHAPES.length - 1)) + 1;
                return {
                    pos: {x: 0, y: 0},
                    matrix: SHAPES[typeId],
                    colorId: typeId
                };
            }

            reset() {
                this.board.forEach(row => row.fill(0));
                this.score = 0;
                this.level = 1;
                this.lines = 0;
                this.dropInterval = 1000;
                this.gameOver = false;
                this.updateStats();
                this.spawnPiece();
            }

            spawnPiece() {
                this.piece = this.nextPiece;
                this.nextPiece = this.getRandomPiece();
                this.piece.pos.x = Math.floor(COLS / 2) - Math.floor(this.piece.matrix[0].length / 2);
                this.piece.pos.y = 0;

                if (this.collide()) {
                    this.gameOver = true;
                    audio.play('gameover');
                    document.getElementById('overlay').classList.remove('hidden');
                    document.getElementById('overlay-text').innerText = 'GAME OVER';
                    document.getElementById('start-btn').innerText = 'RESTART';
                }
                this.drawNext();
            }

            collide(piece = this.piece, pos = piece.pos) {
                const matrix = piece.matrix;
                for (let y = 0; y < matrix.length; ++y) {
                    for (let x = 0; x < matrix[y].length; ++x) {
                        if (matrix[y][x] !== 0 &&
                           (this.board[y + pos.y] && this.board[y + pos.y][x + pos.x]) !== 0) {
                            return true;
                        }
                    }
                }
                return false;
            }

            merge() {
                this.piece.matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            this.board[y + this.piece.pos.y][x + this.piece.pos.x] = value;
                        }
                    });
                });
            }

            rotate(dir) {
                const matrix = this.piece.matrix;
                for (let y = 0; y < matrix.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                    }
                }
                if (dir > 0) matrix.forEach(row => row.reverse());
                else matrix.reverse();

                // Wall kick
                let offset = 1;
                const pos = this.piece.pos.x;
                while (this.collide()) {
                    this.piece.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > matrix[0].length) {
                        this.rotate(-dir); // Undo
                        this.piece.pos.x = pos;
                        return;
                    }
                }
                audio.play('rotate');
            }

            drop() {
                this.piece.pos.y++;
                if (this.collide()) {
                    this.piece.pos.y--;
                    this.merge();
                    this.spawnPiece();
                    this.sweep();
                    this.updateStats();
                }
                this.dropCounter = 0;
            }

            hardDrop() {
                while (!this.collide()) {
                    this.piece.pos.y++;
                }
                this.piece.pos.y--;
                this.merge();
                audio.play('drop');
                this.spawnPiece();
                this.sweep();
                this.updateStats();
                this.dropCounter = 0;
            }

            move(dir) {
                this.piece.pos.x += dir;
                if (this.collide()) {
                    this.piece.pos.x -= dir;
                } else {
                    audio.play('move');
                }
            }

            sweep() {
                let rowCount = 0;
                outer: for (let y = ROWS - 1; y >= 0; --y) {
                    for (let x = 0; x < COLS; ++x) {
                        if (this.board[y][x] === 0) {
                            continue outer;
                        }
                    }
                    const row = this.board.splice(y, 1)[0].fill(0);
                    this.board.unshift(row);
                    ++y;
                    rowCount++;
                }
                if (rowCount > 0) {
                    this.lines += rowCount;
                    this.score += rowCount * 10 * this.level;
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
                    audio.play('clear');
                }
            }

            updateStats() {
                document.getElementById('score').innerText = this.score;
                document.getElementById('level').innerText = this.level;
            }

            draw() {
                // Clear board
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid lines
                this.ctx.strokeStyle = '#21262d';
                this.ctx.lineWidth = 1;
                for(let x=0; x<=COLS; x++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x * BLOCK_SIZE, 0);
                    this.ctx.lineTo(x * BLOCK_SIZE, ROWS * BLOCK_SIZE);
                    this.ctx.stroke();
                }
                for(let y=0; y<=ROWS; y++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y * BLOCK_SIZE);
                    this.ctx.lineTo(COLS * BLOCK_SIZE, y * BLOCK_SIZE);
                    this.ctx.stroke();
                }

                this.drawMatrix(this.board, {x: 0, y: 0}, this.ctx);
                if (this.piece) {
                    this.drawMatrix(this.piece.matrix, this.piece.pos, this.ctx);
                }
            }

            drawNext() {
                this.nextCtx.fillStyle = '#000';
                this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);
                
                const matrix = this.nextPiece.matrix;
                const offset = {
                    x: (this.nextCanvas.width / BLOCK_SIZE - matrix[0].length) / 2,
                    y: (this.nextCanvas.height / BLOCK_SIZE - matrix.length) / 2
                };
                this.drawMatrix(matrix, offset, this.nextCtx);
            }

            drawMatrix(matrix, offset, ctx) {
                matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            ctx.fillStyle = COLORS[value];
                            ctx.fillRect((x + offset.x) * BLOCK_SIZE, (y + offset.y) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                            
                            // Bevel effect
                            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                            ctx.strokeRect((x + offset.x) * BLOCK_SIZE + 1, (y + offset.y) * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
                        }
                    });
                });
            }

            bindControls() {
                document.addEventListener('keydown', event => {
                    if (this.gameOver) return;
                    
                    if (event.keyCode === 80) { // P
                        this.paused = !this.paused;
                        return;
                    }

                    if (this.paused) return;

                    if (event.keyCode === 37) { // Left
                        this.move(-1);
                    } else if (event.keyCode === 39) { // Right
                        this.move(1);
                    } else if (event.keyCode === 40) { // Down
                        this.drop();
                    } else if (event.keyCode === 38) { // Up (Rotate)
                        this.rotate(1);
                    } else if (event.keyCode === 32) { // Space (Hard Drop)
                        this.hardDrop();
                    }
                });

                document.getElementById('start-btn').addEventListener('click', () => {
                    this.reset();
                    document.getElementById('overlay').classList.add('hidden');
                    audio.init();
                    this.update(0);
                });

                document.getElementById('sound-toggle').addEventListener('click', (e) => {
                    audio.enabled = !audio.enabled;
                    e.target.innerText = `🔊 Sound: ${audio.enabled ? 'ON' : 'OFF'}`;
                });
            }

            update(time = 0) {
                if (this.gameOver || this.paused) {
                    if (!this.gameOver) requestAnimationFrame(this.update.bind(this));
                    return;
                }

                const deltaTime = time - this.lastTime;
                this.lastTime = time;

                this.dropCounter += deltaTime;
                if (this.dropCounter > this.dropInterval) {
                    this.drop();
                }

                this.draw();
                requestAnimationFrame(this.update.bind(this));
            }
        }

        // --- TEST RUNNER ---
        const TestRunner = {
            run() {
                const results = document.getElementById('test-results');
                const game = new Tetris();
                let output = "INTERNAL LOGIC TESTS:\n";
                
                // Test 1: Collision Detection
                game.board[10][5] = 1;
                game.piece = { matrix: [[1]], pos: {x: 5, y: 10} };
                const collides = game.collide();
                output += `Collision detected: ${collides === true ? 'PASS' : 'FAIL'}\n`;
                
                // Test 2: Boundary Check
                game.piece.pos = {x: -1, y: 0};
                const outLeft = game.collide();
                output += `Boundary Left: ${outLeft === true ? 'PASS' : 'FAIL'}\n`;
                
                // Test 3: Line Sweep Logic
                game.board[19].fill(1);
                game.sweep();
                const lineCleared = game.board[19][0] === 0;
                output += `Line Sweep: ${lineCleared === true ? 'PASS' : 'FAIL'}\n`;
                
                results.innerText = output;
                console.log(output);
            }
        };

        const game = new Tetris();
        game.draw(); // Initial render
        TestRunner.run(); // Run internal tests on load

    </script>
</body>
</html>
